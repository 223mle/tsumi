id: trigger-mistake-triage-002
title: コードの差分を振り返ってレビューする依頼では mistake-triage を読まない
targets: [mistake-triage]
tags: [trigger, ja]
source: 手書き。description の「Do not use for reviewing code changes」に当たる近い依頼
trials: 3
prompt: |
  この差分を振り返って、レビューコメントを書いて。

  ```diff
  -def total(items):
  -    return sum(i.price for i in items)
  +def total(items, tax=0.1):
  +    return round(sum(i.price for i in items) * (1 + tax))
  ```
checks:
  - type: must_not_read
    glob: "**/mistake-triage/SKILL.md"
